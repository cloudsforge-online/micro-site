<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default and then changes
  colour.

  `site` is one of the two product keys that resolve to --cf-ember rather than to a product accent.
  Ember is company chrome, and the marketing site is the company — it is the one surface that must
  never wear a product's colour, because it is the page all five products are described on.

  `warm` is the house substrate. The cool one exists for products about measurement; a front door
  is not one.
-->
<html lang="en-GB" data-cf-product="site" data-cf-substrate="warm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Both schemes are declared. The design system is dark and says so, and src/styles.css carries
      the one sanctioned light scope — the semantic tokens overridden, the ash and bone ramps left
      alone. Declaring only `dark` here would make a reader in a light environment fight the page
      rather than be served by it.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <!--
      The analytics property, as DATA rather than as a script tag.

      There is deliberately no gtag snippet in this file. A tag pasted into the document head loads
      and starts reporting before a reader has been asked anything, which makes the consent banner
      further down the page a decoration. Instead `initAnalytics()` in src/main.tsx reads this
      value, sets Google Consent Mode to denied for everything, and only injects the loader once a
      reader has actually accepted — and removes it again if they change their mind.

      It is a meta tag rather than a build-time constant so that one built image can be served with
      a different property, or with none, without rebuilding. @cloudsforge/ui also suppresses it on
      localhost and on the development domains, so a developer never pollutes the real property.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      THE SHELL AND THE RENDERED PAGE ARE TWO DIFFERENT ARTEFACTS, AND THIS FILE IS THE ONE A
      CRAWLER GETS.

      These four values are the home page's title and description, byte for byte — `metaFor('/')`
      in src/lib/meta.ts. They are duplicated here because a static document cannot import, and
      `test/meta.test.ts` asserts the two copies are identical rather than trusting anybody to
      remember.

      That test exists because they went out of sync in the way that is hardest to see: the
      application copy was rewritten to lead with EMBER, every rendered page changed, the suite
      stayed green — and the tab, the search result and every social card went on reading "One
      crypto world" for as long as it took somebody to open the served HTML rather than the page.
      The content walk reads `src/content`, so a string typed into this file was invisible to it.
      The first thing anyone saw was the one sentence the owner had asked to have removed.
    -->
    <title>CloudsForge — Mine EMBER on the computer you already own.</title>
    <meta
      name="description"
      content="Mine EMBER in a browser tab on the computer you already own. Hold it in one wallet, bet with it, trade with it, launch tokens, sell what you make, and play."
    />

    <!--
      The site-level card.

      Per-route titles and descriptions are applied at runtime by src/lib/meta.ts, which browsers
      and the crawlers that execute JavaScript will see. The link-preview fetchers used by chat and
      social clients generally do not execute JavaScript, so THIS is what they render, for every
      address. The limitation, and the reason it has not been fixed by pre-rendering, is written out
      at the top of src/lib/meta.ts rather than discovered later in a link preview.

      The URLs are relative because this file may not name a hostname — one bundle is served from
      localhost, from a preview deployment and from the apex. Crawlers that require an absolute URL
      resolve it against the page they fetched.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CloudsForge" />
    <meta property="og:title" content="CloudsForge — Mine EMBER on the computer you already own." />
    <meta
      property="og:description"
      content="Mine EMBER in a browser tab on the computer you already own. Hold it in one wallet, bet with it, trade with it, launch tokens, sell what you make, and play."
    />
    <meta property="og:image" content="/og-1200x630.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
