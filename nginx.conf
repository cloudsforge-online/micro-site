# The marketing site's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback serves the bundle with a success status for every address in existence.
# On a product surface that is bad; on THIS surface it is the worst place in the estate for it to
# be true. This is the site search engines crawl, that link checkers walk, and that people paste
# into chat. Served that way, a "page not found" screen is a document crawlers are entitled to
# index, uptime checks call healthy and link checkers pass — and a deploy that drops /products/worlds
# looks exactly like a deploy that did not.
#
# The application this one replaces does exactly that today.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders the not-found page inside it, and the status line tells the truth.
#
# The cost is that this list and the declarations in src/lib/routes.ts and src/content/products.ts
# must agree. That is one line per top-level route plus one alternation of product slugs, and
# test/routes.test.ts reads all three and fails the build when they diverge — because "remember to
# update nginx.conf" is not a mechanism.

# WHICH ENVIRONMENT IS THIS?
#
# One image is served from the apex, from the testnet host and from a developer's laptop, and only
# the apex may be crawled. Two estates sharing one apex means an indexed testnet page competes with
# the mainnet page it is a copy of, under a hostname that answers with worthless EMBER — and the
# testnet copy is the newer document, which is the one a crawler prefers.
#
# So the sitemap and robots.txt below read this. The pattern matches both shapes deliberately: the
# single-label `site-testnet.` the estate uses now, and the older two-label `site.testnet.` which
# still resolves.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # A marketing site carries a CloudsForge session — it renders the shared bar, and the bar has a
    # sign-out control — so it is framed by nobody but itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    # `^~` so this prefix WINS over the image regex below. Without it a hashed .png emitted into
    # /assets/ would match the regex, take the one-day cache, and lose the immutable header it is
    # entitled to — a rule that is right for a brand card and wrong for a content-addressed asset.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The brand images — favicons and the Open Graph cards — are content-addressed by name rather
    # than by hash, so they get a shorter life than the bundle. A day is long enough that a crawler
    # revisiting the site does not refetch them, and short enough that replacing a card is not a
    # week-long rollout.
    location ~* \.(png|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts and PRODUCT_PAGES in src/content/products.ts.
    # test/routes.test.ts checks both directions: a declared route missing here 404s on its first
    # hard refresh, and a stale entry here serves a 200 for an address that renders the not-found
    # page, which is the same dishonesty inverted.
    #
    # A TRAILING SLASH IS ACCEPTED on every route. `/about/` is an address people link to, and
    # 404ing it would be pedantry rather than honesty; `src/lib/meta.ts` normalises it so the two
    # spellings share one canonical and do not split their own indexing.
    location = / {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(platform|build|about|terms|privacy|risk)/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # The products index.
    location ~ ^/products/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ONE PRODUCT'S PAGE, AND THE SLUGS ARE ENUMERATED. This block was first written as a prefix —
    # `^/(products|…)(/|$)` — which served the shell for everything under /products/, so
    # /products/pay answered 200. React rendered the not-found page inside it and the status line
    # said success, which is precisely the failure the whole of this file exists to prevent, in the
    # one place it was least likely to be looked for.
    #
    # /products/pay is not a hypothetical: Forge Pay was a destination in the previous estate and
    # is now a page inside Forge Hub, so it is exactly the address an old link or an old bookmark
    # carries. It has to 404 so the link can be found and fixed.
    #
    # The price is that a new product is a line here as well as a registry entry. test/routes.test.ts
    # reads this list against PRODUCT_PAGES in both directions, and CI probes the built image.
    location ~ ^/products/(hub|foresight|network|trade|create|market|worlds|pool|exchange|journal|agora)/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap -----------------------------------------------------
    # A sitemap has to carry ABSOLUTE URLs, and nothing built in this repository is allowed to name
    # a hostname: one image is served from localhost, from the testnet host and from the apex, and
    # a sitemap baked with the wrong host is worse than no sitemap at all. robots.txt says so and
    # that is why the site shipped without one.
    #
    # `https://$host` resolves that. The host comes from the REQUEST, so the same image emits the
    # right sitemap on every hostname it is ever served from, and the artefact still names none.
    #
    # ── THE SCHEME IS A LITERAL `https`, AND `$scheme` WAS A LIVE DEFECT ──────────────────────────
    #
    # This block was written `$scheme://$host` and shipped a WRONG sitemap on every real request.
    # TLS ends at Cloudflare; cloudflared speaks plain HTTP to the gateway and the gateway speaks
    # plain HTTP to this container, so `$scheme` is `http` for a reader who arrived over `https`.
    # Measured at the apex on 2026-08-19, before the fix:
    #
    #     Sitemap: http://cloudsforge.online/sitemap.xml
    #
    # A sitemap whose `<loc>` scheme disagrees with the canonical scheme is the textbook way to have
    # every URL treated as a separate, redirecting address. `$host` is still derived from the
    # request and still must be — only the scheme is a constant, because this surface is not
    # reachable over cleartext from anywhere a crawler stands. `test/routes.test.ts` pins both
    # halves: literal `https`, and no hostname anywhere in the block.
    #
    # The paths are enumerated for the same reason the route blocks above are, and
    # `test/routes.test.ts` reads them back against ROUTES and PRODUCT_PAGES in both directions —
    # a page missing here is a page a crawler is never told about, and a stale entry here points a
    # crawler at a 404 the site itself published.
    #
    # No `lastmod`, no `changefreq`, no `priority`. All three would be guesses, Google ignores the
    # last two outright, and a wrong `lastmod` is actively counter-productive.
    location = /sitemap.xml {
        # `types { }` empties the MIME table for this block, so `default_type` is what actually
        # applies. Without it nginx maps the `.xml` in the address through the inherited table and
        # `default_type` is never consulted.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # An environment host publishes no sitemap at all. A sitemap listing testnet URLs is an
        # instruction to index them.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
<url><loc>https://$host/</loc></url>
<url><loc>https://$host/products</loc></url>
<url><loc>https://$host/products/hub</loc></url>
<url><loc>https://$host/products/foresight</loc></url>
<url><loc>https://$host/products/network</loc></url>
<url><loc>https://$host/products/trade</loc></url>
<url><loc>https://$host/products/create</loc></url>
<url><loc>https://$host/products/market</loc></url>
<url><loc>https://$host/products/worlds</loc></url>
<url><loc>https://$host/products/pool</loc></url>
<url><loc>https://$host/products/exchange</loc></url>
<url><loc>https://$host/products/journal</loc></url>
<url><loc>https://$host/products/agora</loc></url>
<url><loc>https://$host/platform</loc></url>
<url><loc>https://$host/build</loc></url>
<url><loc>https://$host/about</loc></url>
<url><loc>https://$host/terms</loc></url>
<url><loc>https://$host/privacy</loc></url>
<url><loc>https://$host/risk</loc></url>
</urlset>
';
    }

    # robots.txt is served here rather than as a static file, for the one reason the static file
    # could not solve: the `Sitemap:` line must be absolute, and only the server knows the host.
    # `public/robots.txt` is kept for `pnpm dev` and `vite preview`, and test/routes.test.ts asserts
    # the two say the same thing so they cannot drift apart.
    #
    # ── THIS FILE COVERS THE WHOLE APEX, WHICH IS NOW MORE THAN THIS BUNDLE ───────────────────────
    #
    # A crawler reads robots.txt at the ORIGIN ROOT and nowhere else. Forge Journal used to be a
    # hostname with a robots.txt of its own; it is now `/journal` on this origin, so its rules have
    # to live HERE or they do not exist. `micro-journal-web` deleted its copy in the same wave for
    # exactly that reason — `/journal/robots.txt` is a file nothing ever fetches.
    #
    # Its two lines are below. `Disallow: /journal/search` is the journal's client-side search over
    # the corpus: every `?q=` is a distinct address rendering the same shell, which is crawl budget
    # spent on a page that is not a document. The second `Sitemap:` is the journal's own, which is
    # per-ARTICLE and per-TOPIC with a real `lastmod` from each article's front matter — this
    # server cannot enumerate that and should not try. Two sitemaps is the normal arrangement and a
    # `Sitemap:` line is exactly how a second one is announced.
    #
    # THE EXCHANGE'S IS THE THIRD, added in wave 2 for the same reason and with the same shape:
    # `micro-exchange-web` deleted its own `robots.txt` when it became `/exchange`, and its sitemap
    # at `/exchange/sitemap.xml` is at an address no crawler has any reason to guess. The link is
    # the step that actually delivers the consolidation for that surface — without it the desk is on
    # the right origin and invisible.
    #
    # No `Disallow:` accompanies it. The journal needed one because its client-side search mints an
    # address per `?q=`; the exchange's equivalent — a pair address per market — is deliberately
    # ABSENT from its sitemap rather than disallowed here, because `/exchange/pools/0x…` is a real
    # page worth indexing when somebody links to it and merely not one this estate vouches for by
    # listing. Its own nginx.conf carries that argument.
    #
    # THE MARKET'S IS THE FOURTH, from wave 3a, and it is the first whose surface brought a SERVICE
    # onto this origin as well as a bundle. That changes nothing here — `/market/v1` is routed to
    # `micro-market` by the gateway and answers JSON, so no crawler follows it anywhere and there is
    # nothing to say about it in this file. Recorded because the question arrives with the wave and
    # the answer is "an API needs no line in robots.txt", not "we forgot".
    #
    # No `Disallow:` accompanies it either, and this one was checked rather than assumed: the
    # journal earns its `Disallow: /journal/search` because client-side search mints an address per
    # `?q=`, and `micro-market-web` has no such thing — its only `searchParams` use is in
    # `src/lib/api.ts`, composing API queries, which never becomes a page address. Its two unbounded
    # route families, `/market/listings/<uuid>` and `/market/collections/<uuid>`, are handled the
    # exchange's way: absent from the sitemap rather than disallowed here, because a listing
    # somebody has linked to is a real page worth indexing and merely not one this estate vouches
    # for by enumerating.
    #
    # FORGE CREATE'S AND FORGE TRADE'S ARE THE FIFTH AND SIXTH, from wave 3b, and neither carries a
    # `Disallow:` for the same reason the exchange's and the market's do not: their unbounded route
    # families — a token page per uuid, a backtest per uuid — are absent from their sitemaps rather
    # than forbidden here. A page somebody has linked to is worth indexing; it is merely not one
    # this estate vouches for by enumerating. Checked rather than assumed: neither bundle has a
    # client-side search minting an address per `?q=`, which is the thing that earns the journal's.
    #
    # FORGE AGORA'S IS THE SEVENTH — AND THE FIRST TO BRING `Disallow:` LINES WITH IT (wave 3c).
    #
    # The six below are not this file's judgement, they are agora's, moved. Five are the reader's
    # OWN pages: each needs a token and answers 401 without one, so a crawler gains nothing by
    # fetching them — but `/agora/whispers` in a search index is a URL that READS like a public page
    # of private messages, and that impression is worth six lines to avoid. `/agora/search` is
    # public and disallowed for the ordinary reason: an infinite query space is a full-text scan of
    # the whole square, once per crawler.
    #
    # `/agora/moderation` is private and deliberately NOT here. Nothing links to it, its own
    # `<meta name="robots">` says `noindex, nofollow`, and a `Disallow:` is a PUBLIC statement that
    # an address exists — publishing the operator queue's address in the first file a curious
    # stranger opens is worse than the risk it would mitigate.
    #
    # ── THESE SIX ARE DERIVED FROM THE REGISTRY, NOT COPIED FROM agora-web ─────────────────────
    #
    # `noIndexPaths` on the surface's row in `ui/packages/ui/src/surfaces.ts`, prefixed with its
    # `basePath`. `test/routes.test.ts` walks that field and fails if any declared path is missing
    # from the block below — so the next surface that arrives with rules is covered by declaring
    # them once, in the registry, rather than by somebody remembering this file exists.
    #
    # This list grows once per wave. Nine more surfaces follow, and each one arrives here in the
    # same commit that deletes its `robots.txt`, because those two edits are one decision: the rules
    # for this origin live in exactly one file and it is this one.
    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Every environment but the apex refuses every crawler, whole.
        #
        # `\n` IS INTERPRETED HERE. nginx does process backslash escapes in a quoted string, so this
        # emits two real newlines — verified at the origin on 2026-08-19 with `od -c` against the
        # running pod, because the opposite claim was written down in this estate and believed.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        # `https` is a literal for the reason the sitemap block above spells out: TLS ends at
        # Cloudflare, so `$scheme` is `http` here and pointed every crawler at a sitemap URL that
        # disagreed with the canonical scheme of the page it was describing.
        return 200 'User-agent: *
Allow: /
Disallow: /journal/search
Disallow: /agora/home
Disallow: /agora/notifications
Disallow: /agora/whispers
Disallow: /agora/bookmarks
Disallow: /agora/settings
Disallow: /agora/search

Sitemap: https://$host/sitemap.xml
Sitemap: https://$host/journal/sitemap.xml
Sitemap: https://$host/exchange/sitemap.xml
Sitemap: https://$host/market/sitemap.xml
Sitemap: https://$host/create/sitemap.xml
Sitemap: https://$host/trade/sitemap.xml
Sitemap: https://$host/agora/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (a favicon, a card, robots.txt) is served; anything else 404s, and the error page
    # below turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
