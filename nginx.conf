# The marketing site's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback serves the bundle with a success status for every address in existence.
# On a product surface that is bad; on THIS surface it is the worst place in the estate for it to
# be true. This is the site search engines crawl, that link checkers walk, and that people paste
# into chat. Served that way, a "page not found" screen is a document crawlers are entitled to
# index, uptime checks call healthy and link checkers pass — and a deploy that drops /products/worlds
# looks exactly like a deploy that did not.
#
# The application this one replaces does exactly that today.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders the not-found page inside it, and the status line tells the truth.
#
# The cost is that this list and the declarations in src/lib/routes.ts and src/content/products.ts
# must agree. That is one line per top-level route plus one alternation of product slugs, and
# test/routes.test.ts reads all three and fails the build when they diverge — because "remember to
# update nginx.conf" is not a mechanism.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# a conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so that no surface may take one
# as a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# ── WHY THIS EXISTS AT ALL, WHICH IS A DEFECT FOUND BY RUNNING nginx RATHER THAN BY READING IT ──
#
# The sitemap below composes every sibling surface as `<subdomain>.$host`. On the apex that is
# exactly right. On `testnet.cloudsforge.online` — which IS an address this estate serves, because
# the apex surface on testnet has no subdomain to suffix — it composes
# `foresight.testnet.cloudsforge.online`: the OLD two-label shape, which `surfaces.ts` records in
# detail as unreachable. Cloudflare's Universal SSL is `*.cloudsforge.online`, a wildcard matches
# exactly one label, and every two-label testnet hostname therefore fails the TLS handshake at the
# edge. The testnet sitemap would have been a list of addresses that cannot be connected to.
#
# The composition is not fixed here, because it CANNOT be: the correct testnet name is
# `foresight-testnet.cloudsforge.online`, a suffix on the subdomain, and deriving it needs the apex
# separated from the label — which is `splitEnvLabel`, and is more logic than a config file should
# carry. What is done instead is the thing that was right anyway: a non-mainnet environment is not
# a thing to be indexed at all. It answers `Disallow: /` and serves no sitemap.
#
# That is the stronger position on its own merits. A testnet estate carries test EMBER, a faucet
# and deliberately broken states; every page of it competing with the real one in a search index is
# a support problem before it is an SEO problem.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # A marketing site carries a CloudsForge session — it renders the shared bar, and the bar has a
    # sign-out control — so it is framed by nobody but itself.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    # `^~` so this prefix WINS over the image regex below. Without it a hashed .png emitted into
    # /assets/ would match the regex, take the one-day cache, and lose the immutable header it is
    # entitled to — a rule that is right for a brand card and wrong for a content-addressed asset.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The brand images — favicons and the Open Graph cards — are content-addressed by name rather
    # than by hash, so they get a shorter life than the bundle. A day is long enough that a crawler
    # revisiting the site does not refetch them, and short enough that replacing a card is not a
    # week-long rollout.
    location ~* \.(png|svg|ico|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts and PRODUCT_PAGES in src/content/products.ts.
    # test/routes.test.ts checks both directions: a declared route missing here 404s on its first
    # hard refresh, and a stale entry here serves a 200 for an address that renders the not-found
    # page, which is the same dishonesty inverted.
    #
    # A TRAILING SLASH IS ACCEPTED on every route. `/about/` is an address people link to, and
    # 404ing it would be pedantry rather than honesty; `src/lib/meta.ts` normalises it so the two
    # spellings share one canonical and do not split their own indexing.
    location = / {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(platform|build|about|terms|privacy|risk)/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # The products index.
    location ~ ^/products/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ONE PRODUCT'S PAGE, AND THE SLUGS ARE ENUMERATED. This block was first written as a prefix —
    # `^/(products|…)(/|$)` — which served the shell for everything under /products/, so
    # /products/pay answered 200. React rendered the not-found page inside it and the status line
    # said success, which is precisely the failure the whole of this file exists to prevent, in the
    # one place it was least likely to be looked for.
    #
    # /products/pay is not a hypothetical: Forge Pay was a destination in the previous estate and
    # is now a page inside Forge Hub, so it is exactly the address an old link or an old bookmark
    # carries. It has to 404 so the link can be found and fixed.
    #
    # The price is that a new product is a line here as well as a registry entry. test/routes.test.ts
    # reads this list against PRODUCT_PAGES in both directions, and CI probes the built image.
    location ~ ^/products/(hub|foresight|network|trade|create|market|worlds)/?$ {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with \$host ----------------
    # BOTH BODIES ARE GENERATED FROM @cloudsforge/ui/sitemap, WHICH READS THE SURFACE REGISTRY.
    #
    # They are here rather than in public/ because a sitemap must carry ABSOLUTE URLs and nothing
    # built in this repository is allowed to name a hostname: one image is served from localhost,
    # from a preview deployment and from the apex. public/robots.txt said exactly that as its
    # excuse for having no Sitemap: line at all, and concluded that the sitemap "belongs to
    # whatever terminates TLS for the apex, which is the one component that knows what the apex
    # is". nginx is that component — it has \$host on every request — so the addresses below are
    # composed per request and the artefact stays environment-free.
    #
    # This surface is the APEX, so \$host IS the apex and every sibling is a prefix on it. That is
    # the property that makes the whole estate's sitemap serveable from here and from nowhere else.
    #
    # The six servesUi:false hostnames and the three operator consoles are absent, and that is the
    # registry's decision rather than this file's — see SITEMAP_SURFACES. test/sitemap.test.ts
    # regenerates both bodies from the module and fails if a byte here has drifted, so this block
    # is generated output that happens to live in a config file.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://foresight.$host</loc></url>
  <url><loc>$scheme://network.$host</loc></url>
  <url><loc>$scheme://trade.$host</loc></url>
  <url><loc>$scheme://create.$host</loc></url>
  <url><loc>$scheme://market.$host</loc></url>
  <url><loc>$scheme://worlds.$host</loc></url>
  <url><loc>$scheme://hub.$host</loc></url>
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://hub.$host/wallet</loc></url>
  <url><loc>$scheme://network.$host/faucet</loc></url>
  <url><loc>$scheme://developers.$host</loc></url>
  <url><loc>$scheme://emberkin.$host</loc></url>
  <url><loc>$scheme://aetherholm.$host</loc></url>
  <url><loc>$scheme://tessera.$host</loc></url>
  <url><loc>$scheme://status.$host</loc></url>
  <url><loc>$scheme://explorer.$host</loc></url>
  <url><loc>$scheme://$host/products</loc></url>
  <url><loc>$scheme://$host/platform</loc></url>
  <url><loc>$scheme://$host/build</loc></url>
  <url><loc>$scheme://$host/about</loc></url>
  <url><loc>$scheme://$host/terms</loc></url>
  <url><loc>$scheme://$host/privacy</loc></url>
  <url><loc>$scheme://$host/risk</loc></url>
  <url><loc>$scheme://$host/products/hub</loc></url>
  <url><loc>$scheme://$host/products/network</loc></url>
  <url><loc>$scheme://$host/products/create</loc></url>
  <url><loc>$scheme://$host/products/trade</loc></url>
  <url><loc>$scheme://$host/products/foresight</loc></url>
  <url><loc>$scheme://$host/products/market</loc></url>
  <url><loc>$scheme://$host/products/worlds</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }


    # ---- everything else -------------------------------------------------
    # A real file (a favicon, a card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    #
    # `public/robots.txt` was DELETED rather than left to be shadowed by the exact-match location
    # above. An `= /robots.txt` location wins over this prefix, so the static file would never have
    # been served — and a file that is in the repository, is deployed, and is unreachable is the
    # worst of the three states, because the next reader edits it and nothing happens.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
